[project]
name = "aqua-platform-challenge"
version = "0.1.0"
description = "NumPy autodiff, neural-network training, pruning, and evaluation."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]
notebook = [
    "ipykernel>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
